<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Tool Updates Report</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 24px; color: #222 }
        header { margin-bottom: 18px }
        .meta { color: #666; font-size: 0.95rem }
        .tool { border: 1px solid #e1e1e1; padding: 12px; margin-bottom: 12px; border-radius: 6px }
        .tool h2 { margin: 0 0 6px 0; font-size: 1.15rem }
        .tool .meta { margin-bottom: 8px }
        pre { background: #f8f8f8; padding: 10px; border-radius: 4px; overflow:auto }
    </style>
</head>
<body>
<header>
    <h1>Tool Updates Report</h1>
    <div class="meta">Generated: <span th:text="${timestamp}">TIMESTAMP</span> — Total processing time: <span th:text="${totalProcessingTimeMs}">0</span> ms</div>
</header>
<main>
    <div th:if="${#lists.isEmpty(results)}">
        <p>No results available.</p>
    </div>

    <div th:each="result : ${results}" class="tool">
        <h2 th:text="${result.toolName}">Tool Name</h2>
        <div class="meta">Status: <strong th:text="${result.status}">STATUS</strong> — Processing time: <span th:text="${result.processingTimeMs}">0</span> ms
            <span th:if="${result.inputTokens != null}"> — Input: <span th:text="${result.inputTokens}">0</span> tokens</span>
            <span th:if="${result.outputTokens != null}"> — Output: <span th:text="${result.outputTokens}">0</span> tokens</span>
        </div>

        <div th:if="${result.htmlContent != null}">
            <div th:utext="${result.htmlContent}"></div>
        </div>
        <div th:if="${result.htmlContent == null}">
            <pre th:text="${result.content}">No content</pre>
        </div>
    </div>
</main>
<footer>
    <div class="meta">Generated by Gemini AI Service</div>
</footer>
</body>
</html>
