<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">

<head>
    <meta charset="UTF-8">
    <title>Tool Updates</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f8faff;
            /* Very light blue background */
        }

        h1 {
            text-align: center;
            color: #0b253b;
            /* Darker blue */
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .tool-update {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.1);
            /* Blue-ish shadow */
            margin-bottom: 35px;
            padding: 40px;
            border: 1px solid #e1e8ed;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tool-update:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.15);
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .tool-name {
            font-size: 1.8em;
            font-weight: 700;
            color: #2c82c9;
            /* Bright Blue */
            margin: 0;
            text-transform: capitalize;
            letter-spacing: -0.5px;
        }

        .meta-info {
            font-size: 0.85em;
            color: #5d7ca6;
            background: #eef6fc;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .content {
            font-size: 1.05em;
            color: #4a5568;
        }

        /* Content Markdown Styling */
        .content h1,
        .content h2,
        .content h3 {
            color: #1a365d;
            /* Dark Blue */
            margin-top: 1.8em;
            margin-bottom: 0.8em;
            font-weight: 700;
        }

        .content h3 {
            font-size: 1.25em;
            border-left: 4px solid #3498db;
            padding-left: 12px;
        }

        .content ul,
        .content ol {
            padding-left: 25px;
            margin-bottom: 1.5em;
        }

        .content li {
            margin-bottom: 8px;
            position: relative;
        }

        .content strong {
            color: #0066cc;
            /* Strong Blue */
            font-weight: 700;
        }

        .content pre {
            background: #1e293b;
            /* Dark Navy for code background */
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 0.9em;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .content code {
            font-family: 'Consolas', 'Monaco', monospace;
            background: #edf2f7;
            padding: 3px 6px;
            border-radius: 4px;
            color: #2b6cb0;
            /* Blue code text */
            font-size: 0.9em;
        }

        .content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: 1em;
        }

        .content blockquote {
            border-left: 4px solid #63b3ed;
            margin: 20px 0;
            padding: 15px 25px;
            color: #4a5568;
            background: #ebf8ff;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .content a {
            color: #3182ce;
            text-decoration: none;
            border-bottom: 1px dotted #3182ce;
        }

        .content a:hover {
            border-bottom: 1px solid #3182ce;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            color: #a0aec0;
            font-size: 0.9em;
            border-top: 1px solid #e1e8ed;
            padding-top: 30px;
        }

        .error-box {
            color: #c53030;
            padding: 20px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Latest Tool Updates</h1>
    <p style="text-align: center; color: #718096; margin-bottom: 50px;">
        Generated on <span th:text="${#temporals.format(timestamp, 'EEE, d MMM yyyy HH:mm:ss')}">Date</span>
    </p>

    <div th:each="result : ${results}" class="tool-update">
        <div class="tool-header">
            <h2 class="tool-name" th:text="${result.toolName}">Tool Name</h2>
            <span class="meta-info" th:text="${result.processingTimeMs + 'ms'}">0ms</span>
        </div>

        <div class="content">
            <div th:if="${result.status == 'SUCCESS'}" th:utext="${result.htmlContent}">
                <!-- Rendered HTML Content will go here -->
            </div>
            <div th:unless="${result.status == 'SUCCESS'}" class="error-box">
                <strong>Error retrieving updates:</strong> <span th:text="${result.content}">Error message</span>
            </div>
        </div>
    </div>

    <div class="footer">
        Powered by <strong>Gemini AI</strong> &bull; Total Processing Time: <span
            th:text="${totalProcessingTimeMs}">0</span>ms
    </div>

</body>

</html>
